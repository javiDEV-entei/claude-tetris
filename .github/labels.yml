# Catálogo cerrado de labels usado por .github/workflows/claude-issue-triage.yml
# El workflow sincroniza estos labels en el repo (crea los que falten) y Claude
# debe elegir exclusivamente entre estos valores al etiquetar un issue.

# Tipo (exactamente uno)
- name: "type: bug"
  color: "d73a4a"
  description: "Algo no funciona como debería"
- name: "type: feature"
  color: "a2eeef"
  description: "Nueva funcionalidad o mejora"
- name: "type: refactor"
  color: "cfd3d7"
  description: "Cambio interno sin efecto visible en el juego"
- name: "type: docs"
  color: "0075ca"
  description: "Cambios en README, CLAUDE.md u otra documentación"
- name: "type: question"
  color: "d876e3"
  description: "Falta información para diagnosticar o decidir"

# Área (uno o más)
- name: "area: gameplay"
  color: "1d76db"
  description: "Reglas del juego: piezas, rotación, colisiones, líneas"
- name: "area: render"
  color: "1d76db"
  description: "Dibujado en canvas: draw(), drawBlock(), drawNext()"
- name: "area: ui"
  color: "1d76db"
  description: "HTML/CSS, overlay, textos visibles"
- name: "area: controls"
  color: "1d76db"
  description: "Entrada de teclado y manejo de eventos"
- name: "area: scoring"
  color: "1d76db"
  description: "Puntuación, líneas, nivel, velocidad de caída"
- name: "area: ci"
  color: "1d76db"
  description: "GitHub Actions y automatización del repo"

# Prioridad (exactamente una)
- name: "priority: P0"
  color: "b60205"
  description: "Bloqueante, rompe el juego"
- name: "priority: P1"
  color: "d93f0b"
  description: "Alto impacto, debería resolverse pronto"
- name: "priority: P2"
  color: "fbca04"
  description: "Impacto moderado"
- name: "priority: P3"
  color: "c2e0c6"
  description: "Bajo impacto o mejora menor"

# Complejidad (exactamente una)
- name: "size: S"
  color: "e4e669"
  description: "Cambio pequeño, un archivo, sin riesgo de acoplamiento"
- name: "size: M"
  color: "e4e669"
  description: "Cambio moderado, puede tocar varios puntos acoplados"
- name: "size: L"
  color: "e4e669"
  description: "Cambio grande o que toca varias constantes acopladas"
